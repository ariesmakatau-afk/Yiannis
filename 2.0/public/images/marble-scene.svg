<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="orbGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f3f6f8"/>
      <stop offset="55%" stop-color="#c9d7de"/>
      <stop offset="100%" stop-color="#93a9b4"/>
    </radialGradient>
    <radialGradient id="orbShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2438" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2438" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3f5"/>
      <stop offset="100%" stop-color="#d3e0e6"/>
    </linearGradient>
    <pattern id="meanderTrim" x="0" y="0" width="40" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0h10v10H0zM10 0h30v3H16v4h24v3H10z" fill="#5f89ab"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgFade)"/>

  <!-- soft contact shadow for the large orb -->
  <ellipse cx="760" cy="560" rx="230" ry="70" fill="url(#orbShadow)"/>
  <!-- large orb -->
  <circle cx="720" cy="480" r="150" fill="url(#orbGrad)"/>

  <!-- small satellite orbs -->
  <circle cx="1180" cy="230" r="34" fill="url(#orbGrad)" opacity="0.9"/>
  <circle cx="220" cy="650" r="26" fill="url(#orbGrad)" opacity="0.85"/>

  <!-- abstracted column motifs (line art, not a literal copy of any photo) -->
  <g stroke="#7f97a2" stroke-width="3" fill="none" opacity="0.55">
    <!-- top-left column -->
    <line x1="140" y1="60" x2="140" y2="300"/>
    <line x1="180" y1="60" x2="180" y2="300"/>
    <line x1="120" y1="60" x2="200" y2="60"/>
    <line x1="110" y1="40" x2="210" y2="40"/>
    <line x1="110" y1="300" x2="210" y2="300"/>

    <!-- top-right column -->
    <line x1="1400" y1="50" x2="1400" y2="260"/>
    <line x1="1440" y1="50" x2="1440" y2="260"/>
    <line x1="1380" y1="50" x2="1460" y2="50"/>
    <line x1="1370" y1="30" x2="1470" y2="30"/>
    <line x1="1370" y1="260" x2="1470" y2="260"/>

    <!-- bottom-right column -->
    <line x1="1330" y1="640" x2="1330" y2="860"/>
    <line x1="1370" y1="640" x2="1370" y2="860"/>
    <line x1="1310" y1="640" x2="1390" y2="640"/>
    <line x1="1300" y1="620" x2="1400" y2="620"/>

    <!-- bottom-left small column -->
    <line x1="90" y1="720" x2="90" y2="860"/>
    <line x1="120" y1="720" x2="120" y2="860"/>
    <line x1="75" y1="720" x2="135" y2="720"/>
  </g>

  <!-- faint greek key trim, bottom edge -->
  <rect x="0" y="866" width="1600" height="10" fill="url(#meanderTrim)" opacity="0.4"/>
</svg>
